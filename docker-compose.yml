services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://documind@db:5432/documind
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
